<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-app</title>

    <!-- css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>

<body style="padding: 3vw 20vw; background-image:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(notes.jpg); background-size: cover;  box-shadow : rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset, rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;">
    <div class="top" id="top" style="display: flex;">
        <div style="width: 20%; display: flex; align-items: center; font-size: 1.5rem; color: rgb(255, 214, 183); "> Note count : &nbsp;<span id="note-count">0</span></div>
        <h1 style="width: 80%;position: relative; left: 200px; color: #ff8b33; text-shadow:4px 4px 6px rgba(5, 92, 116, 0.693);">Notes App</h1>
    </div>

    <div class="input-group mb-3" style="width: 100%;">
        <span class="input-group-text">Topic</span>
        <div class="form-floating">
            <input type="text" class="form-control" id="floatingInputGroup1" placeholder="Topic" required>
            <label for="floatingInputGroup1">Topic here...</label>
        </div>
    </div>


    <div class="form-floating" style="display: flex; flex-direction: column;">
        <input type="text" class="form-control" placeholder="write your note here" id="floatingTextarea2"
            style="height: 100px; width: 100%;"></input>
        <button onclick="addToCard()" title="click to add note" style="
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    transition: 0.3s;
    height: 3vw; width: 10vw; border-radius: 5px; position:  relative; top:10px; left: 83%;
    ">
            + Add Note
        </button>
        <label for="floatingTextarea2">Write your note here...</label>
    </div>

    <!-- card container -->
    <div class="container" id="note-card"
        style="margin-top: 30px; width: 100% ;display: flex;flex-wrap: wrap; gap: 2px; padding: 10px; border-radius: 5px; height: 20vw; overflow: hidden; overflow-y: scroll; background: transparent;">
        <!-- cards will be added here -->
    </div>


    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="noteApp.js"></script>
</body>

</html>
